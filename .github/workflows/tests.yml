name: Signal checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt pytest ruff mypy types-requests types-PyYAML
      - run: ruff check --select E4,E7,E9,F,I bitunix_bot/intraday.py bitunix_bot/signal_*.py scripts/backtest_intraday.py tests/test_intraday.py
      - run: mypy --strict --follow-imports=silent bitunix_bot/intraday.py bitunix_bot/signal_*.py scripts/backtest_intraday.py
      - run: python -m pytest tests/test_e2e.py tests/test_intraday.py -q
      - run: node --test tests/extension_worker.test.cjs
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/extension_ui.cjs
