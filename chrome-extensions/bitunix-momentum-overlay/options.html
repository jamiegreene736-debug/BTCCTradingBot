<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Bitunix Intraday Signals Settings</title>
    <style>
      body {
        margin: 0;
        padding: 28px;
        color: #111827;
        background: #f6f8fb;
        font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      }
      main {
        max-width: 620px;
        margin: 0 auto;
        padding: 24px;
        background: #fff;
        border: 1px solid #dde3ec;
        border-radius: 8px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0 0 20px; color: #5d6878; }
      label { display: block; margin: 14px 0 6px; font-weight: 700; }
      input {
        width: 100%;
        height: 42px;
        padding: 0 12px;
        border: 1px solid #cfd7e3;
        border-radius: 6px;
        font: inherit;
      }
      button {
        margin-top: 18px;
        height: 40px;
        padding: 0 16px;
        border: 0;
        border-radius: 6px;
        color: #fff;
        background: #2563eb;
        font-weight: 800;
        cursor: pointer;
      }
      #status { margin-left: 12px; color: #157f3b; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>Bitunix Intraday Signals</h1>
      <p>Connect the Chrome overlay to your private Railway dashboard.</p>
      <label for="dashboardUrl">Dashboard URL</label>
      <input id="dashboardUrl" placeholder="https://btcc-trading-bot-production.up.railway.app">
      <label for="password">Dashboard password</label>
      <input id="password" type="password" autocomplete="current-password">
      <button id="save">Save settings</button>
      <span id="status"></span>
    </main>
    <script src="options.js"></script>
  </body>
</html>
